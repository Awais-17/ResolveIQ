name: ResolveIQ CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Orchestrator Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r orchestrator/requirements.txt

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest orchestrator/tests/ -v

      - name: Security & Code Integrity Check
        run: |
          python -c "from orchestrator.services.security import scan_prompt_injection; print('Security guardrails loaded cleanly.')"
