[project]
name = "resolveiq-orchestrator"
version = "0.1.0"
description = "ResolveIQ AI agent orchestrator (LangGraph + Vertex AI + Firestore)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["graph", "services", "prompts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
