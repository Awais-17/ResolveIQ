services:
  - type: web
    name: resolveiq-orchestrator
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r orchestrator/requirements.txt
    startCommand: uvicorn orchestrator.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: GEMINI_API_KEY
        sync: false
      - key: RESOLVEIQ_USE_STUB
        value: "0"
      - key: FIREBASE_PROJECT_ID
        value: resolveiq-demo

  - type: web
    name: resolveiq-dashboard
    env: static
    buildCommand: cd apps/dashboard && npm install && npm run build
    staticPublishPath: apps/dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ORCHESTRATOR_URL
        value: https://resolveiq-orchestrator.onrender.com
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyA1iE3TCa9cP9o10MCZW0r07rcYkjH8W7s
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: resolveiq-demo.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: resolveiq-demo
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: resolveiq-demo.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: 850610929101
      - key: VITE_FIREBASE_APP_ID
        value: "1:850610929101:web:1cb9f48ef06910e7e81884"

  - type: web
    name: resolveiq-customer-portal
    env: static
    buildCommand: cd apps/customer-portal && npm install && npm run build
    staticPublishPath: apps/customer-portal/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ORCHESTRATOR_URL
        value: https://resolveiq-orchestrator.onrender.com
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyA1iE3TCa9cP9o10MCZW0r07rcYkjH8W7s
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: resolveiq-demo.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: resolveiq-demo
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: resolveiq-demo.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: 850610929101
      - key: VITE_FIREBASE_APP_ID
        value: "1:850610929101:web:1cb9f48ef06910e7e81884"

